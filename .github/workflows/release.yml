name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # 자체 포함(self-contained): .NET 설치 없이 어디서나 실행되는 단일 exe
      - name: Publish self-contained executable
        run: >
          dotnet publish YoutubeMp3/YoutubeMp3.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # 프레임워크 종속(framework-dependent): .NET 8 데스크톱 런타임이 설치된 PC용(용량이 작음)
      - name: Publish framework-dependent executable
        run: >
          dotnet publish YoutubeMp3/YoutubeMp3.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish-fd

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path publish\* -DestinationPath "YoutubeMp3-$version-win-x64.zip"
          Compress-Archive -Path publish-fd\* -DestinationPath "YoutubeMp3-$version-win-x64-framework-dependent.zip"
          # 압축 해제 없이 받아서 바로 실행할 수 있도록 두 exe를 단독 자산으로도 올린다.
          Copy-Item "publish\YoutubeMp3.exe" "YoutubeMp3-$version-win-x64.exe"
          Copy-Item "publish-fd\YoutubeMp3.exe" "YoutubeMp3-$version-win-x64-framework-dependent.exe"

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "YoutubeMp3-$tag-win-x64.zip",
            "YoutubeMp3-$tag-win-x64-framework-dependent.zip",
            "YoutubeMp3-$tag-win-x64.exe",
            "YoutubeMp3-$tag-win-x64-framework-dependent.exe"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title $tag --generate-notes
          }

  # 안드로이드판은 android/ 의 Kotlin 앱이다. 윈도우 작업이 릴리즈를 세운 뒤 같은 릴리즈에 APK를 붙인다.
  android:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 서명: 저장소 비밀값 ANDROID_KEYSTORE_B64(키 파일 base64) · ANDROID_KEYSTORE_PASS 가 있으면 늘 같은 키로
      # 서명한다(그래야 폰에서 지우지 않고 업데이트된다). 없으면 판마다 키가 달라 지우고 다시 깔아야 한다.
      - name: Build APKs
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          if [ -n "$KEYSTORE_B64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/youtubemp3-release.keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
            echo "고정 키로 서명합니다"
          else
            echo "비밀값이 없어 디버그 키로 서명합니다 — 폰에서 업데이트하려면 지우고 다시 깔아야 합니다"
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain -PappVersionName="$version" -PappVersionCode="$code"

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          out=android/app/build/outputs/apk/release
          cp "$out/app-arm64-v8a-release.apk" "YoutubeMp3-$tag-android-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "YoutubeMp3-$tag-android-armv7.apk"
          gh release upload "$tag" YoutubeMp3-*-android-*.apk --clobber
